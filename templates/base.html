{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
{% block extra_css %}{% endblock %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="Final Trip - Dignity, humanity, and solidarity in repatriation services">

    <!-- Font Awesome -->


    <!-- Bootstrap -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">

    <link rel="stylesheet" href="{% static 'css/main.css' %}">

    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
    <!-- Lightbox -->
    <link rel="stylesheet" href="{% static 'css/lightbox.min.css' %}">

    <!-- Custom Styles (LOAD LAST to override) -->


    <title>Final Trip {% block title %}{% endblock %}</title>
</head>

<body class="{% block body_class %}{% endblock %}">
    <!-- Top Bar -->
    {#% include 'partials/_topbar.html' %#}

    <!-- Navigation -->
    {% include 'partials/_navbar.html' %}

    <!-- Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    {% include 'partials/_footer.html' %}

<!-- Scripts -->
    <!-- Wir behalten jQuery nur, falls alte Plugins es brauchen -->
    <script src="{% static 'js/jquery-3.3.1.min.js' %}"></script>

    <!-- NUR NOCH DIESE EINE BOOTSTRAP DATEI (Version 5) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="{% static 'js/lightbox.min.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>

    <script>
        // Globaler Year-Fix für alle Elemente mit Klasse .year
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.year').forEach(el => {
                el.textContent = new Date().getFullYear();
            });
        });
    </script>
</body>

    <!-- Dynamic Year for Footer -->
    <script>
        document.querySelectorAll('.year').forEach(el => {
            el.textContent = new Date().getFullYear();
        });
    </script>
<!-- Bootstrap 5 JS (für Navbar Toggle) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
